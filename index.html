<html lang="es" data-theme="">

<title>Game News</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Instrument+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>

:root[data-theme="dark"]{--bg:#101216;--sf:#171a20;--ink:#eceef2;--mu:#99a0ad;--ln:#272b33;--ac:#8aa2ff;--tl:22%;--tt:82%}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--bd)}
a{color:inherit;text-decoration:none}a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
h1,h2,h3{font-family:var(--hd);line-height:1.15;margin:0;font-weight:700}
ul{list-style:none;margin:0;padding:0}
.w{max-width:1120px;margin:0 auto;padding:0 20px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--ln)}
.top{display:flex;align-items:center;gap:28px;height:60px}
.logo{font:700 20px var(--hd);letter-spacing:-.02em}
.logo span{color:var(--ac)}
nav{flex:1}nav>ul{display:flex;gap:4px}
nav li{position:relative}
nav>ul>li>a{display:block;padding:8px 12px;border-radius:6px;color:var(--mu);font-weight:500}
nav>ul>li>a:hover,nav a[aria-current]{color:var(--ink)}
nav a[aria-current]{box-shadow:inset 0 -2px var(--ink)}
.dd{display:none;position:absolute;left:0;top:100%;min-width:190px;background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:6px}
li:hover>.dd,li:focus-within>.dd{display:block}
.dd a{display:block;padding:7px 10px;border-radius:5px;color:var(--mu);font-size:14px}.dd a:hover{background:var(--bg);color:var(--ink)}
.tools{display:flex;gap:8px;align-items:center}
.ib,.btn{font:500 14px var(--bd);border:1px solid var(--ln);background:var(--sf);color:var(--ink);border-radius:6px;padding:7px 12px;cursor:pointer}
.btn.p{background:var(--ink);color:var(--bg);border-color:var(--ink)}
#sf{display:none;padding:10px 0 14px}#sf.on{display:block}
#sf input{width:100%;font:16px var(--bd);padding:10px 12px;border:1px solid var(--ln);border-radius:6px;background:var(--sf);color:var(--ink)}
.tr{border-top:1px solid var(--ln);overflow-x:auto;white-space:nowrap}
.tr .w{display:flex;gap:22px;height:40px;align-items:center;font-size:14px;color:var(--mu)}
.tr a[aria-current]{color:var(--ink);box-shadow:0 2px var(--ac)}.tr a:hover{color:var(--ink)}
.tr b{color:var(--ink);font-weight:500}
main{padding:36px 0 64px;min-height:70vh}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.ph h1{font-size:clamp(32px,5vw,48px);letter-spacing:-.02em}.ph p{margin:6px 0 0;color:var(--mu)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:28px}
.chip{padding:6px 14px;border:1px solid var(--ln);border-radius:99px;font-size:14px;color:var(--mu);background:var(--sf);cursor:pointer;font-family:var(--bd)}
.chip[aria-current],.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.g2{display:grid;grid-template-columns:1.5fr 1fr;gap:40px}
.th{position:relative;aspect-ratio:4/3;background:hsl(var(--h) 28% var(--tl));color:hsl(var(--h) 38% var(--tt));border-radius:6px;display:flex;align-items:flex-end;padding:10px;overflow:hidden}
.th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.th i,.dc{z-index:1}
.th b{font:700 15px/1.1 var(--hd)}.th i{position:absolute;top:8px;right:10px;font:700 18px var(--hd);font-style:normal}
.big{aspect-ratio:16/9;padding:24px}.big b{font-size:clamp(28px,5vw,52px);letter-spacing:-.02em}.big i{font-size:34px;top:20px;right:24px}
small,.m{color:var(--mu);font-size:13px}
.lead h2{font-size:clamp(24px,3.4vw,34px);margin:16px 0 8px;letter-spacing:-.01em}.lead p{color:var(--mu);margin:0 0 8px;max-width:60ch}
.row{display:grid;grid-template-columns:104px 1fr;gap:16px;padding:16px 0;border-top:1px solid var(--ln);align-items:start}
.row:first-child{border-top:0;padding-top:0}.row h3{font-size:17px;margin:2px 0 4px}.row:hover h3,.lead:hover h2{text-decoration:underline;text-underline-offset:3px}
.sec{margin-top:56px}.sec>h2{font-size:24px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:baseline}
.sec>h2 a{font:500 14px var(--bd);color:var(--ac)}
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:40px;margin-top:8px}
.cols h3{font-size:18px;margin-bottom:12px}
.art{max-width:680px}.art h1{font-size:clamp(30px,5vw,44px);letter-spacing:-.02em;margin:10px 0 12px}
.art .th{margin:24px 0}.art p{font-size:18px;line-height:1.7;margin:0 0 18px}
.crumb{font-size:14px;color:var(--mu)}.crumb a:hover{color:var(--ink);text-decoration:underline}
.og{display:grid;grid-template-columns:200px 1fr;gap:40px}
.og label{display:block;font-size:14px;color:var(--mu);margin:18px 0 6px}.og select,.og input[type=range]{width:100%}
.og select{padding:8px;border:1px solid var(--ln);border-radius:6px;background:var(--sf);color:var(--ink);font:14px var(--bd)}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:20px}
.gr .th{aspect-ratio:3/4}.gr h3{font-size:15px;margin:10px 0 2px}.gr .pc{display:flex;gap:8px;align-items:baseline}
.gr s{color:var(--mu);font-size:13px}.gr strong{font-weight:500}.dc{position:absolute;top:8px;left:8px;background:var(--ink);color:var(--bg);font:500 12px var(--bd);padding:2px 7px;border-radius:4px}
.box{max-width:400px}.box input{display:block;width:100%;margin:6px 0 14px;padding:10px 12px;border:1px solid var(--ln);border-radius:6px;background:var(--sf);color:var(--ink);font:16px var(--bd)}
.box label{font-size:14px;color:var(--mu)}.note{color:var(--mu);font-size:14px;margin-top:14px}
footer{border-top:1px solid var(--ln);padding:28px 0 40px;color:var(--mu);font-size:14px}
footer .w{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}footer nav ul{display:flex;gap:16px;flex-wrap:wrap}footer a:hover{color:var(--ink)}
@media(max-width:820px){.g2,.cols,.og{grid-template-columns:1fr;gap:28px}.top{gap:12px}.dd{display:none!important}
nav{overflow-x:auto;white-space:nowrap}.tools .btn.p{display:none}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>

 <div class="w top">

28:["Una lista de juegos esperados resulta más útil si incluye género, estudio, plataformas y fecha confirmada.","Distingue los lanzamientos con día anunciado de aquellos que tienen una ventana general o siguen sin fecha. La expectativa es subjetiva y no equivale a una garantía de calidad. Verifica los datos en las páginas oficiales."],

function articleBody(a){
 const c=BODY[a.i]||["Consulta la página oficial del juego y los comunicados de su desarrollador para verificar fechas, plataformas y funciones.","Distingue la información confirmada de los rumores y revisa las actualizaciones antes de tomar una decisión de compra."];
 return `<p><strong>${c[0]}</strong></p><p>${c[1]}</p><p class="note">Información editorial. Las fechas, precios, disponibilidad y anuncios nuevos deben verificarse en los canales oficiales del juego o de su distribuidor.</p>`;
}

function art(i){const a=A[i];if(!a)return nf();
 const rel=by(x=>x.i!=a.i&&(x.s==a.s||(a.t&&x.t==a.t))).slice(0,4);
 return `<article class="art"><div class="crumb"><a href="#/">Inicio</a> / <a href="#/${a.s}">${S[a.s].n}</a> / <a href="#/${a.s}/${sl(a.sub)}">${a.sub}</a></div>
 <h1>${a.h}</h1><span class="m">${meta(a)}, Redacción Game News</span>${th(a,1)}
 ${articleBody(a)}
 ${a.t?`<p><a class="chip" href="#/tema/${a.t}">Más sobre ${T[a.t][0]}</a></p>`:''}</article>
 <section class="sec"><h2>Relacionadas</h2>${rel.map(row).join('')}</section>`}
let pf='all',mx=1500,so='d';
function ofertas(){return head('Ofertas en juegos','Descuentos en juegos de todas las plataformas.')+`<div class="og"><aside>
 <div class="chips" style="margin:0;flex-direction:column;align-items:flex-start">${Object.keys(PL).map(k=>`<button class="chip${k==pf?' on':''}" data-p="${k}">${PL[k]}</button>`).join('')}</div>
 <label for="mx">Precio máximo: $<span id="mv">${mx}</span></label><input id="mx" type="range" min="300" max="1500" step="100" value="${mx}">
 <label for="so">Ordenar por</label><select id="so"><option value="d">Mayor descuento</option><option value="p">Menor precio</option></select></aside>
 <div><div class="gr" id="gr"></div></div></div>`}
function grid(){
 const r=O.map(o=>({n:o[0],p:o[1],o:o[2],d:o[3],f:Math.round(o[2]*(100-o[3])/100)})).filter(o=>(pf=='all'||o.p.includes(pf))&&o.f<=mx).sort((a,b)=>so=='d'?b.d-a.d:a.f-b.f);
 $('#gr').innerHTML=r.map(o=>`<div><div class="th" style="--h:${hue(o.n)}"><span class="dc">-${o.d}%</span>${IMGO[o.n]?`<img src="${IMGO[o.n]}" alt="${o.n}" loading="lazy">`:`<b>${o.n}</b>`}</div><h3>${o.n}</h3><small>${o.p.split(' ').map(x=>PL[x]).join(', ')}</small><div class="pc"><strong>$${o.f}</strong><s>$${o.o}</s></div></div>`).join('')||'<p>Ninguna oferta coincide. Sube el precio máximo o elige otra plataforma.</p>'}
function bind(){
 document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{pf=b.dataset.p;route()});
 const x=$('#mx');if(x){x.oninput=()=>{mx=+x.value;$('#mv').textContent=mx;grid()};$('#so').value=so;$('#so').onchange=e=>{so=e.target.value;grid()};grid()}
 const f=$('#cf');if(f)f.onsubmit=e=>{e.preventDefault();$('#cm').textContent='Esta es una demo: aún no hay servidor de cuentas conectado.'}}
function search(q){q=decodeURIComponent(q||'').trim();const r=q?A.filter(a=>(a.h+a.sub+S[a.s].n).toLowerCase().includes(q.toLowerCase())):[];
 return head('Resultados para “'+q.replace(/</g,'&lt;')+'”',r.length+' artículos encontrados')+(r.length?r.map(row).join(''):'<p>Prueba con otro término, por ejemplo el nombre de un juego o una consola.</p>')}
const acct=m=>head(m?'Crea tu cuenta':'Inicia sesión',m?'Guarda artículos y recibe avisos de tus juegos.':'Accede para guardar tus artículos.')+
 `<div class="chips"><a class="chip" href="#/cuenta" ${m?'':'aria-current="page"'}>Iniciar sesión</a><a class="chip" href="#/cuenta/registro" ${m?'aria-current="page"':''}>Registrarme</a></div>
 <form class="box" id="cf">${m?'<label for="u">Nombre</label><input id="u" required>':''}<label for="e">Correo</label><input id="e" type="email" required><label for="p">Contraseña</label><input id="p" type="password" required>
 <button class="btn p" type="submit">${m?'Crear cuenta':'Entrar'}</button><p class="note" id="cm"></p></form>`;
const about=()=>head('Acerca de Game News','Noticias, reseñas y guías de videojuegos, escritas con claridad.')+`<div class="art"><p>Cubrimos consolas, PC y esports. Si tienes una pista o quieres colaborar, escríbenos a redaccion@gamenews.example.</p></div>`;
const nf=()=>head('Página no encontrada','Esta dirección no existe o cambió.')+'<a class="btn p" href="#/">Volver al inicio</a>';

function route(){
 const p=location.hash.replace(/^#\/?/,'').split('/'),k=p[0];let h;
 if(!k)h=home();else if(S[k])h=section(k,p[1]);else if(k=='tema')h=topic(p[1]);else if(k=='articulo')h=art(+p[1]);
 else if(k=='ofertas')h=ofertas();else if(k=='buscar')h=search(p[1]);else if(k=='cuenta')h=acct(p[1]=='registro');else if(k=='acerca')h=about();else h=nf();
 $('#v').innerHTML=h;bind();
 const cur=(k=='articulo'&&A[+p[1]])?A[+p[1]].s:k,tp=k=='tema'?p[1]:k=='ofertas'?'ofertas':'';
 document.querySelectorAll('#nav>li>a').forEach(a=>a.toggleAttribute('aria-current',a.dataset.k==cur));
 document.querySelectorAll('#trn a').forEach(a=>a.toggleAttribute('aria-current',a.dataset.k==tp));
 document.title=(k&&S[k]?S[k].n+' | ':'')+'Game News';
}
$('#nav').innerHTML=Object.keys(S).map(k=>`<li><a href="#/${k}" data-k="${k}">${S[k].n}</a><ul class="dd">${S[k].subs.map(x=>`<li><a href="#/${k}/${sl(x)}">${x}</a></li>`).join('')}</ul></li>`).join('');
$('#trn').innerHTML='<b>Tendencias</b>'+Object.keys(T).map(k=>`<a href="#/tema/${k}" data-k="${k}">${T[k][0]}</a>`).join('')+'<a href="#/ofertas" data-k="ofertas">Ofertas en juegos</a>';
$('#fn').innerHTML=Object.keys(S).map(k=>`<li><a href="#/${k}">${S[k].n}</a></li>`).join('')+'<li><a href="#/ofertas">Ofertas</a></li><li><a href="#/acerca">Acerca de</a></li>';
$('#sb').onclick=()=>{$('#sf').classList.toggle('on');$('#q').focus()};
$('#q').onkeydown=e=>{if(e.key=='Enter'&&e.target.value.trim()){location.hash='#/buscar/'+encodeURIComponent(e.target.value.trim());$('#sf').classList.remove('on')}};
$('#tb').onclick=()=>{const d=document.documentElement,dark=getComputedStyle(d).getPropertyValue('--bg').trim()=='#101216';d.dataset.theme=dark?'light':'dark'};
addEventListener('hashchange',()=>{route();scrollTo(0,0);$('#m').focus({preventScroll:true})});
route();
