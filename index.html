<html lang="es" data-theme="">
<head>

<title>Game News</title>

<style>
:root{--bg:#f6f7f9;--sf:#fff;--ink:#15171c;--mu:#646b78;--ln:#e3e5ea;--ac:#2d4fe0;--tl:90%;--tt:26%;

@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101216;--sf:#171a20;--ink:#eceef2;--mu:#99a0ad;--ln:#272b33;--ac:#8aa2ff;--tl:22%;--tt:82%}}
:root[data-theme="dark"]{--bg:#101216;--sf:#171a20;--ink:#eceef2;--mu:#99a0ad;--ln:#272b33;--ac:#8aa2ff;--tl:22%;--tt:82%}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--bd)}
a{color:inherit;text-decoration:none}a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
h1,h2,h3{font-family:var(--hd);line-height:1.15;margin:0;font-weight:700}
ul{list-style:none;margin:0;padding:0}
.w{max-width:1120px;margin:0 auto;padding:0 20px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--ln)}
.top{display:flex;align-items:center;gap:28px;height:60px}
.logo{font:700 20px var(--hd);letter-spacing:-.02em}
.logo span{color:var(--ac)}
nav{flex:1}nav>ul{display:flex;gap:4px}
nav li{position:relative}
nav>ul>li>a{display:block;padding:8px 12px;border-radius:6px;color:var(--mu);font-weight:500}
nav>ul>li>a:hover,nav a[aria-current]{color:var(--ink)}
nav a[aria-current]{box-shadow:inset 0 -2px var(--ink)}
.dd{display:none;position:absolute;left:0;top:100%;min-width:190px;background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:6px}
li:hover>.dd,li:focus-within>.dd{display:block}
.dd a{display:block;padding:7px 10px;border-radius:5px;color:var(--mu);font-size:14px}.dd a:hover{background:var(--bg);color:var(--ink)}
.tools{display:flex;gap:8px;align-items:center}
.ib,.btn{font:500 14px var(--bd);border:1px solid var(--ln);background:var(--sf);color:var(--ink);border-radius:6px;padding:7px 12px;cursor:pointer}
.btn.p{background:var(--ink);color:var(--bg);border-color:var(--ink)}
#sf{display:none;padding:10px 0 14px}#sf.on{display:block}
#sf input{width:100%;font:16px var(--bd);padding:10px 12px;border:1px solid var(--ln);border-radius:6px;background:var(--sf);color:var(--ink)}
.tr{border-top:1px solid var(--ln);overflow-x:auto;white-space:nowrap}
.tr .w{display:flex;gap:22px;height:40px;align-items:center;font-size:14px;color:var(--mu)}
.tr a[aria-current]{color:var(--ink);box-shadow:0 2px var(--ac)}.tr a:hover{color:var(--ink)}
.tr b{color:var(--ink);font-weight:500}
main{padding:36px 0 64px;min-height:70vh}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.ph h1{font-size:clamp(32px,5vw,48px);letter-spacing:-.02em}.ph p{margin:6px 0 0;color:var(--mu)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:28px}
.chip{padding:6px 14px;border:1px solid var(--ln);border-radius:99px;font-size:14px;color:var(--mu);background:var(--sf);cursor:pointer;font-family:var(--bd)}
.chip[aria-current],.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.g2{display:grid;grid-template-columns:1.5fr 1fr;gap:40px}
.th{position:relative;aspect-ratio:4/3;background:hsl(var(--h) 28% var(--tl));color:hsl(var(--h) 38% var(--tt));border-radius:6px;display:flex;align-items:flex-end;padding:10px;overflow:hidden}
.th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.th i,.dc{z-index:1}
.th b{font:700 15px/1.1 var(--hd)}.th i{position:absolute;top:8px;right:10px;font:700 18px var(--hd);font-style:normal}
.big{aspect-ratio:16/9;padding:24px}.big b{font-size:clamp(28px,5vw,52px);letter-spacing:-.02em}.big i{font-size:34px;top:20px;right:24px}
small,.m{color:var(--mu);font-size:13px}
.lead h2{font-size:clamp(24px,3.4vw,34px);margin:16px 0 8px;letter-spacing:-.01em}.lead p{color:var(--mu);margin:0 0 8px;max-width:60ch}
.row{display:grid;grid-template-columns:104px 1fr;gap:16px;padding:16px 0;border-top:1px solid var(--ln);align-items:start}
.row:first-child{border-top:0;padding-top:0}.row h3{font-size:17px;margin:2px 0 4px}.row:hover h3,.lead:hover h2{text-decoration:underline;text-underline-offset:3px}
.sec{margin-top:56px}.sec>h2{font-size:24px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:baseline}
.sec>h2 a{font:500 14px var(--bd);color:var(--ac)}
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:40px;margin-top:8px}
.cols h3{font-size:18px;margin-bottom:12px}
.art{max-width:680px}.art h1{font-size:clamp(30px,5vw,44px);letter-spacing:-.02em;margin:10px 0 12px}
.art .th{margin:24px 0}.art p{font-size:18px;line-height:1.7;margin:0 0 18px}
.crumb{font-size:14px;color:var(--mu)}.crumb a:hover{color:var(--ink);text-decoration:underline}
.og{display:grid;grid-template-columns:200px 1fr;gap:40px}
.og label{display:block;font-size:14px;color:var(--mu);margin:18px 0 6px}.og select,.og input[type=range]{width:100%}
.og select{padding:8px;border:1px solid var(--ln);border-radius:6px;background:var(--sf);color:var(--ink);font:14px var(--bd)}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:20px}
.gr .th{aspect-ratio:3/4}.gr h3{font-size:15px;margin:10px 0 2px}.gr .pc{display:flex;gap:8px;align-items:baseline}
.gr s{color:var(--mu);font-size:13px}.gr strong{font-weight:500}.dc{position:absolute;top:8px;left:8px;background:var(--ink);color:var(--bg);font:500 12px var(--bd);padding:2px 7px;border-radius:4px}
.box{max-width:400px}.box input{display:block;width:100%;margin:6px 0 14px;padding:10px 12px;border:1px solid var(--ln);border-radius:6px;background:var(--sf);color:var(--ink);font:16px var(--bd)}
.box label{font-size:14px;color:var(--mu)}.note{color:var(--mu);font-size:14px;margin-top:14px}
.gr .card{cursor:pointer;display:block;width:100%;text-align:left;background:none;border:0;padding:0;color:inherit;font:inherit}
.gr .card:hover h3{text-decoration:underline;text-underline-offset:3px}
.mo{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:20px}
.mo[hidden]{display:none}
.md{background:var(--sf);color:var(--ink);border:1px solid var(--ln);border-radius:12px;max-width:440px;width:100%;max-height:90vh;overflow:auto;padding:20px;position:relative}
.md .th{aspect-ratio:16/9;margin-bottom:16px}
.md h2{font-size:24px;margin-bottom:4px}
.md .pr{display:flex;gap:10px;align-items:baseline;margin:12px 0 4px}.md .pr strong{font:700 28px var(--hd)}.md .pr s{color:var(--mu)}
.md .sv{color:var(--ac);font-weight:500;font-size:14px}
.md .xx{position:absolute;top:10px;right:10px;z-index:2}
.buy{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.buy a{display:block;text-align:center;padding:11px 14px;border-radius:6px;font-weight:500;background:var(--ink);color:var(--bg);border:1px solid var(--ink)}
.buy a:hover{opacity:.88}
.md .note{margin-top:12px}
footer{border-top:1px solid var(--ln);padding:28px 0 40px;color:var(--mu);font-size:14px}
footer .w{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}footer nav ul{display:flex;gap:16px;flex-wrap:wrap}footer a:hover{color:var(--ink)}
@media(max-width:820px){.g2,.cols,.og{grid-template-columns:1fr;gap:28px}.top{gap:12px}.dd{display:none!important}
nav{overflow-x:auto;white-space:nowrap}.tools .btn.p{display:none}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>

const BODY = {
  0: "La PlayStation 5 Pro llegó como una versión más potente de la PS5 original. Su principal mejora está en la GPU, junto con tecnologías como PlayStation Spectral Super Resolution (PSSR), pensadas para mejorar la calidad de imagen sin sacrificar tanto rendimiento.\n\nSony la orientó a jugadores con televisores 4K y pantallas compatibles con frecuencias altas. Algunos juegos reciben parches específicos para aprovechar mejor el hardware, aunque la PS5 Pro no sustituye a la PS5 normal y muchos títulos siguen funcionando en ambas consolas.\n\nLa decisión de comprarla depende principalmente de tu pantalla y de cuánto valores una imagen más estable en modos de rendimiento y mayor resolución.",
  1: "Nintendo Switch 2 es la sucesora de Nintendo Switch y conserva el concepto de consola híbrida. La consola cuenta con una pantalla LCD de 7.9 pulgadas, resolución de 1080p y soporte para hasta 120 Hz en títulos compatibles.\n\nNintendo también incorporó Joy-Con 2 con conexión magnética y funciones adicionales. La consola admite juegos de Switch mediante compatibilidad con títulos físicos y digitales compatibles, aunque existen excepciones.\n\nEntre sus funciones destaca GameChat, pensado para comunicación durante las partidas, y el modo TV con salida de hasta 4K en juegos compatibles.",
  2: "Rockstar Games confirmó que Grand Theft Auto VI llegará el 26 de mayo de 2026 para PlayStation 5 y Xbox Series X|S. El juego está ambientado en el estado de Leonida y sigue a Jason Duval y Lucia Caminos.\n\nLa historia se desarrolla en Vice City y otras zonas del estado. Rockstar ha presentado varios tráileres y material oficial donde aparecen personajes, lugares y situaciones relacionadas con la historia.\n\nEl lanzamiento marca el regreso de la serie principal de Grand Theft Auto después de Grand Theft Auto V, publicado originalmente en 2013.",
  3: "Xbox Game Pass reúne distintos planes de suscripción con acceso a un catálogo de juegos para consola, PC y dispositivos compatibles, según el plan contratado.\n\nEl catálogo cambia con el tiempo. Algunos títulos se incorporan al servicio y otros salen después de un periodo determinado. Los lanzamientos de Xbox Game Studios también forman parte de la estrategia del servicio.\n\nPara saber qué juegos están disponibles en un momento concreto, conviene revisar el catálogo oficial de Xbox Game Pass, ya que las fechas de entrada y salida cambian.",
  4: "Black Myth: Wukong es un action RPG desarrollado por Game Science y basado en elementos de Viaje al Oeste, una obra clásica de la literatura china.\n\nEl jugador controla al Destinado, un personaje inspirado en Sun Wukong. El juego combina combate cuerpo a cuerpo, transformaciones, habilidades y enfrentamientos contra diferentes jefes.\n\nSu primer gran contenido adicional debe distinguirse de las actualizaciones normales del juego. Game Science ha hablado públicamente sobre contenido futuro, pero los detalles oficiales de un DLC deben comprobarse en sus canales antes de considerarlos confirmados.",
  5: "Los retrasos forman parte del desarrollo de videojuegos y suelen producirse cuando un estudio necesita más tiempo para terminar el producto o mejorar su calidad.\n\nEntre los lanzamientos con fechas anunciadas, los cambios de calendario deben tomarse a partir de comunicados oficiales de los desarrolladores o distribuidores. Una fecha que aparece en una tienda o en una filtración no equivale a una confirmación.\n\nPor eso, cuando un juego esperado cambia de fecha, conviene distinguir entre un anuncio oficial, un rumor y una fecha provisional.",
  6: "Nintendo Direct es el formato de presentación utilizado por Nintendo para mostrar información sobre juegos, actualizaciones y productos de la compañía.\n\nDurante estas presentaciones Nintendo suele anunciar fechas de lanzamiento, nuevos tráileres, contenido adicional y títulos de terceros. El contenido cambia en cada emisión, por lo que una lista de anuncios depende de la edición concreta del Direct.\n\nPara conocer todos los anuncios de una presentación específica, la fuente más fiable es la emisión oficial y los comunicados publicados por Nintendo después del evento.",
  7: "Ghost of Yōtei es la nueva entrega de Sucker Punch Productions dentro de la línea de juegos iniciada con Ghost of Tsushima.\n\nEl juego está protagonizado por Atsu y se desarrolla alrededor del monte Yōtei, en Hokkaido, durante el Japón del siglo XVII. La historia presenta un nuevo personaje y un escenario distinto al de Jin Sakai.\n\nSony anunció el juego para PlayStation 5 y posteriormente presentó material adicional sobre su mundo, combate y protagonista.",
  8: "Black Myth: Wukong combina exploración, acción y combates contra jefes dentro de un mundo inspirado en la mitología y literatura china.\n\nEl sistema de combate gira alrededor de diferentes posturas, hechizos, transformaciones y armas. El Destinado también cuenta con recursos para adaptar su forma de jugar según el enemigo.\n\nEl apartado técnico destaca por sus escenarios detallados y por el uso de tecnologías modernas de iluminación y renderizado en las versiones compatibles.",
  9: "Star Wars Outlaws es un juego de acción y aventura desarrollado por Massive Entertainment y publicado por Ubisoft.\n\nLa historia sigue a Kay Vess y a su compañero Nix mientras intentan realizar un gran golpe en el mundo criminal de Star Wars. El juego permite visitar distintos planetas y relacionarse con organizaciones criminales.\n\nSu propuesta combina exploración, combate, sigilo, vehículos y misiones relacionadas con las decisiones del jugador.",
  10: "Elden Ring: Shadow of the Erdtree es la expansión de Elden Ring desarrollada por FromSoftware.\n\nLa expansión lleva al jugador a la Tierra de las Sombras, una región separada del mapa principal con nuevas zonas, mazmorras, armas, enemigos, jefes y personajes.\n\nShadow of the Erdtree mantiene el sistema de combate de Elden Ring y añade nuevos mecanismos de progresión para equilibrar la dificultad dentro de su nuevo territorio.",
  11: "The Legend of Zelda: Echoes of Wisdom presenta a la princesa Zelda como protagonista principal. El juego introduce la habilidad de crear réplicas de objetos y enemigos mediante el Tri Rod.\n\nEstas réplicas sirven para resolver acertijos, superar obstáculos y combatir. La aventura combina exploración de Hyrule con mazmorras y situaciones en las que el jugador debe elegir qué objeto reproducir.\n\nEl título fue lanzado para Nintendo Switch y ofrece una propuesta diferente dentro de la serie Zelda.",
  12: "Genshin Impact utiliza Protogemas como una de sus principales monedas para conseguir Destinos entrelazados y Destinos conocidos, necesarios para realizar deseos.\n\nLas Protogemas se obtienen mediante actividades como misiones, eventos, encargos diarios, logros, exploración y algunos contenidos del juego. La cantidad obtenida depende de la actividad realizada.\n\nSi quieres conseguirlas de forma constante, completar los encargos diarios y participar en eventos disponibles suele ser una de las formas más directas dentro del juego.",
  13: "Una build de Fuerza y Fe en Elden Ring combina armas que aprovechan Fuerza con armas, encantamientos y atributos relacionados con Fe.\n\nEste tipo de personaje ofrece opciones para combate cuerpo a cuerpo y ataques a distancia mediante encantamientos. La distribución de atributos depende del arma y del nivel total del personaje.\n\nAntes de repartir puntos conviene revisar los requisitos del arma elegida y el escalado que ofrece, porque dos armas con requisitos parecidos pueden aprovechar los atributos de manera distinta.",
  14: "Fortnite incluye distintas formas de mejorar durante una partida. Aprender a construir, apuntar, moverte y administrar tus recursos tiene un impacto directo en el resultado.\n\nTambién ayuda conocer las armas disponibles y adaptar tu inventario al tipo de combate que esperas encontrar. La posición dentro de la zona segura influye en las decisiones durante la partida.\n\nLas estrategias más útiles cambian según el modo de juego y las actualizaciones de cada temporada.",
  15: "La PS5 Pro incluye opciones de configuración relacionadas con resolución, frecuencia de actualización, HDR y salida de vídeo.\n\nSi tu pantalla admite 4K y una frecuencia alta, conviene activar las funciones compatibles tanto en la consola como en el televisor. También debes comprobar que el cable HDMI y el puerto utilizado admitan las características de tu pantalla.\n\nLos ajustes específicos de cada juego también importan, ya que algunos títulos ofrecen modos gráficos distintos para priorizar resolución o rendimiento.",
  16: "Black Myth: Wukong permite adaptar el personaje mediante armas, armaduras, habilidades y hechizos. No existe una única configuración válida para todos los enemigos.\n\nPara una build equilibrada conviene elegir habilidades que complementen tu forma de combatir. También debes prestar atención a las bonificaciones de las armas y armaduras y a los recursos necesarios para mejorar el equipo.\n\nContra jefes difíciles suele ser más importante aprender sus patrones de ataque y aprovechar las ventanas de daño que aumentar una estadística sin una estrategia definida.",
  17: "Grand Theft Auto VI está previsto para PlayStation 5 y Xbox Series X|S. Rockstar ha situado la historia en Leonida, un estado ficticio inspirado en Florida, con Vice City como uno de sus lugares principales.\n\nLa historia gira alrededor de Jason Duval y Lucia Caminos, dos protagonistas involucrados en actividades criminales.\n\nAntes del lanzamiento, Rockstar ha mostrado distintos elementos del mundo abierto, personajes y situaciones del juego mediante material oficial.",
  18: "Xbox Series X y Xbox Series S pertenecen a la misma generación, pero tienen diferencias de hardware y resolución.\n\nSeries X está orientada a un rendimiento superior y cuenta con una unidad de disco en su diseño estándar. Series S es más pequeña y está enfocada a juegos digitales, con un hardware pensado para resoluciones inferiores.\n\nEn ambas consolas puedes acceder al ecosistema Xbox y a servicios como Game Pass según el plan contratado.",
  19: "Nintendo Switch 2 permite transferir parte de la información de una Nintendo Switch anterior mediante las herramientas oficiales de transferencia.\n\nAntes de comenzar, debes comprobar que ambas consolas estén actualizadas y seguir el proceso indicado por Nintendo. La transferencia depende del tipo de datos y del juego.\n\nLos datos guardados y otros contenidos tienen condiciones específicas, así que conviene revisar las indicaciones oficiales para evitar perder información.",
  20: "El tráiler oficial de Grand Theft Auto VI mostró nuevas imágenes de Vice City y presentó a sus protagonistas, Jason Duval y Lucia Caminos.\n\nEl material también permite observar vehículos, zonas urbanas, playas, clubes y otros escenarios del estado de Leonida. Rockstar ha usado estos avances para presentar parte del mundo y el tono de la historia.\n\nLa fecha anunciada para el juego es el 26 de mayo de 2026, con versiones para PlayStation 5 y Xbox Series X|S.",
  21: "Black Myth: Wukong ha recibido actualizaciones destinadas a mejorar el juego y corregir problemas detectados después de su lanzamiento.\n\nLos avances publicados por Game Science muestran combates, escenarios y enfrentamientos con diferentes enemigos. El juego sigue centrado en la historia del Destinado y en sus enfrentamientos contra criaturas inspiradas en la mitología china.\n\nLos detalles de nuevos contenidos deben distinguirse entre actualizaciones confirmadas y proyectos todavía no anunciados oficialmente.",
  22: "Shadow of the Erdtree amplía Elden Ring con una nueva región, nuevos enemigos, jefes, armas y zonas para explorar.\n\nEl contenido de lanzamiento está pensado para jugadores que ya avanzaron bastante en el juego principal. Para acceder a la expansión es necesario cumplir determinados requisitos dentro de Elden Ring.\n\nLa expansión también añade el sistema de Bendiciones del Reino de las Sombras, destinado a mejorar el rendimiento del personaje dentro de la nueva región.",
  23: "Marvel’s Spider-Man 2 es una aventura de acción desarrollada por Insomniac Games. La historia sigue a Peter Parker y Miles Morales mientras enfrentan nuevas amenazas en Nueva York.\n\nEl juego permite alternar entre ambos Spider-Man y utiliza sus diferentes habilidades para el combate y la exploración. También incorpora desplazamiento con telarañas, alas de telaraña y nuevas zonas de la ciudad.\n\nLa versión para PC llegó posteriormente con opciones gráficas adicionales y compatibilidad con distintas configuraciones de hardware.",
  24: "Los Nintendo Direct reúnen anuncios relacionados con los próximos juegos y productos de Nintendo. Dependiendo de la presentación, la compañía muestra títulos propios, juegos de terceros, fechas de lanzamiento y contenido adicional.\n\nLa información de cada Direct cambia según la edición. Para evitar confundir anuncios de diferentes presentaciones, conviene identificar la fecha exacta del evento y revisar la lista oficial publicada por Nintendo.",
  25: "IEM Cologne es uno de los eventos destacados del calendario competitivo de Counter-Strike. Equipos profesionales se enfrentan durante distintas fases para buscar el título y una parte del premio.\n\nLos resultados dependen de cada edición y de los equipos participantes. Las estadísticas individuales, mapas ganados y resultados de cada serie ayudan a entender el desempeño de los equipos durante el torneo.",
  26: "VCT Americas reúne a equipos profesionales de VALORANT de la región de América. La competencia se divide en etapas durante el año y entrega puntos y oportunidades para avanzar en el circuito internacional.\n\nLos playoffs reúnen a los equipos mejor posicionados de cada etapa. Los resultados y clasificaciones cambian conforme avanzan las jornadas, por lo que deben consultarse según la fecha del torneo.",
  27: "The International es el principal campeonato competitivo de Dota 2 organizado alrededor del circuito profesional del juego.\n\nLos equipos participantes llegan mediante clasificaciones y resultados obtenidos durante la temporada, según el sistema competitivo vigente. El torneo reúne a organizaciones de distintas regiones y define al campeón de esa edición.\n\nEl formato y los criterios de clasificación han cambiado en diferentes años, así que cada edición tiene su propio calendario y sistema de acceso.",
  28: "Los juegos más esperados dependen de sus fechas anunciadas, plataformas confirmadas y del interés generado por sus desarrolladores.\n\nEntre los títulos con gran atención pública se encuentran proyectos como Grand Theft Auto VI, Ghost of Yōtei y otros lanzamientos de estudios grandes. La lista cambia cuando aparecen nuevos anuncios o cuando un juego modifica su fecha.\n\nPara hacer una lista precisa conviene separar los juegos con fecha confirmada de aquellos cuyo lanzamiento todavía no tiene día definido.",
  29: "La PS5 Pro ofrece mejoras de hardware frente a la PS5 estándar, principalmente en el rendimiento gráfico.\n\nLa diferencia se aprecia sobre todo en juegos compatibles con las funciones específicas de la consola. La PS5 original sigue siendo capaz de ejecutar el catálogo de PlayStation 5, mientras que la PS5 Pro busca ofrecer una experiencia gráfica más avanzada.\n\nLa elección depende de factores como la pantalla, el presupuesto y la importancia que le des a la resolución y al rendimiento.",
  30: "GTA VI llegará a consolas de actual generación, pero Rockstar no ha anunciado una versión para PC junto con las versiones de PlayStation 5 y Xbox Series X|S.\n\nPor eso, todavía no existe una lista oficial de requisitos de PC para GTA VI. Cualquier procesador, tarjeta gráfica, cantidad de RAM o almacenamiento publicados como requisitos deben tratarse como información no confirmada hasta que Rockstar anuncie una versión para ordenador.\n\nCuando exista una versión para PC, los requisitos oficiales serán la referencia adecuada para saber si un equipo puede ejecutarla.",
  31: "Los juegos para un jugador siguen ocupando una parte importante de la industria. Muchos estudios continúan lanzando aventuras centradas en campañas narrativas, exploración y progresión individual.\n\nTítulos como The Legend of Zelda: Echoes of Wisdom, Black Myth: Wukong y Elden Ring: Shadow of the Erdtree muestran distintas formas de diseñar experiencias centradas en el jugador.\n\nSu éxito también demuestra que existe demanda para juegos con campañas extensas y sistemas de juego pensados para avanzar a tu propio ritmo.",
  32: "Xbox Series X|S cuenta con un catálogo amplio que incluye juegos propios de Xbox, títulos de terceros y juegos disponibles mediante servicios como Game Pass.\n\nEntre los títulos destacados de la generación se encuentran Forza Horizon 5, Halo Infinite, Microsoft Flight Simulator y varios juegos multiplataforma.\n\nLa disponibilidad concreta de cada juego depende de la tienda, la región y los cambios del catálogo de los servicios de suscripción.",
  33: "Nintendo Switch 2 cuenta con juegos desarrollados específicamente para la nueva consola y también ofrece compatibilidad con una selección de juegos de Nintendo Switch.\n\nLa lista de títulos confirmados crece conforme Nintendo y otras compañías anuncian sus proyectos. Algunos juegos reciben versiones mejoradas para aprovechar el hardware de Switch 2.\n\nPara saber si un juego tendrá versión nativa, actualización o compatibilidad con la versión anterior, conviene revisar la información oficial del editor.",
  34: "Elegir un videojuego depende de factores como el género, la plataforma, el precio y el tiempo disponible para jugar.\n\nSi buscas una aventura narrativa, conviene revisar la duración de la campaña y el tipo de progresión. Para juegos competitivos, importa más el modo multijugador, la comunidad y la frecuencia de actualizaciones.\n\nTambién es útil comprobar los requisitos técnicos y las plataformas antes de comprar, sobre todo en PC."
};
function art(i){const a=A[i];if(!a)return nf();
  const rel=by(x=>x.i!=a.i&&(x.s==a.s||(a.t&&x.t==a.t))).slice(0,4);
  const body=(BODY[a.i]||'').split(/\\n\\n/).map(p=>`<p>${p}</p>`).join('');
  return `<article class="art"><div class="crumb"><a href="#/">Inicio</a> / <a href="#/${a.s}">${S[a.s].n}</a> / <a href="#/${a.s}/${sl(a.sub)}">${a.sub}</a></div>
  <h1>${a.h}</h1><span class="m">${meta(a)}, Redacción Game News</span>${th(a,1)}
  ${body}
  ${a.t?`<p><a class="chip" href="#/tema/${a.t}">Más sobre ${T[a.t][0]}</a></p>`:''}</article>
  <section class="sec"><h2>Relacionadas</h2>${rel.map(row).join('')}</section>`}

let pf='all',mx=1500,so='d';

 <div class="chips" style="margin:0;flex-direction:column;align-items:flex-start">${Object.keys(PL).map(k=>`<button class="chip${k==pf?' on':''}" data-p="${k}">${PL[k]}</button>`).join('')}</div>

 <div><div class="gr" id="gr"></div></div></div>`}
function grid(){
 const r=O.map(o=>({n:o[0],p:o[1],o:o[2],d:o[3],f:Math.round(o[2]*(100-o[3])/100)})).filter(o=>(pf=='all'||o.p.includes(pf))&&o.f<=mx).sort((a,b)=>so=='d'?b.d-a.d:a.f-b.f);
 $('#gr').innerHTML=r.map(o=>`<button class="card" data-g="${o.n}" type="button"><div class="th" style="--h:${hue(o.n)}"><span class="dc">-${o.d}%</span>${IMGO[o.n]?`<img src="${IMGO[o.n]}" alt="${o.n}" loading="lazy">`:`<b>${o.n}</b>`}</div><h3>${o.n}</h3><small>${o.p.split(' ').map(x=>PL[x]).join(', ')}</small><div class="pc"><strong>$${o.f}</strong><s>$${o.o}</s></div></button>`).join('')||'<p>Ninguna oferta coincide. Sube el precio máximo o elige otra plataforma.</p>'}

const STORE={ps:['PlayStation Store',n=>'https://store.playstation.com/es-mx/search/'+encodeURIComponent(n)],
 xbox:['Xbox Store',n=>'https://www.xbox.com/es-MX/search?q='+encodeURIComponent(n)],
 switch:['Nintendo eShop',n=>'https://www.nintendo.com/es-mx/Search/Search-299117.html?q='+encodeURIComponent(n)],
 pc:['Steam',n=>{const m=(IMGO[n]||'').match(/apps\/(\d+)/);return m?'https://store.steampowered.com/app/'+m[1]:'https://store.steampowered.com/search/?term='+encodeURIComponent(n)}]};

 <h2>${n}</h2><small>${ps.map(x=>PL[x]).join(', ')}</small>

 <p class="note">Te llevamos a la tienda oficial para completar la compra. El precio final puede variar según tu región.</p>`;

 const f=$('#cf');if(f)f.onsubmit=e=>{e.preventDefault();$('#cm').textContent='Esta es una demo: aún no hay servidor de cuentas conectado.'}}

 return head('Resultados para “'+q.replace(/</g,'&lt;')+'”',r.length+' artículos encontrados')+(r.length?r.map(row).join(''):'<p>Prueba con otro término, por ejemplo el nombre de un juego o una consola.</p>')}

 const cur=(k=='articulo'&&A[+p[1]])?A[+p[1]].s:k,tp=k=='tema'?p[1]:k=='ofertas'?'ofertas':'';
 document.querySelectorAll('#nav>li>a').forEach(a=>a.toggleAttribute('aria-current',a.dataset.k==cur));

 document.title=(k&&S[k]?S[k].n+' | ':'')+'Game News';
}
